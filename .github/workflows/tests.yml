name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Runs tools/test/run_tests.sh in the connectiq-tester image, which has the Connect IQ SDK,
      # device files and simulator: https://github.com/matco/connectiq-tester
      # v2.8.0 because v2.9.0 was built without unzip and has no SDK (monkeyc: command not found).
      - name: Run unit tests on venu3s
        run: docker run --rm -v "$PWD":/app -w /app --entrypoint bash ghcr.io/matco/connectiq-tester:v2.8.0 tools/test/run_tests.sh venu3s
