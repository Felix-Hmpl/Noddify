name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Compiles with -t and runs the (:test) functions in a headless simulator.
      # The image bundles the Connect IQ SDK, device files and simulator: https://github.com/matco/connectiq-tester
      - name: Run unit tests on venu3s
        run: docker run --rm -v "$PWD":/app -w /app ghcr.io/matco/connectiq-tester:v2.9.0 venu3s
